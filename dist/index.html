<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f8f2"><meta name="description" content="Un pequeño paso cada día. Tu espacio para cultivar hábitos y celebrar tus avances."><title>Poquito · Tus hábitos, a tu ritmo</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><div id="toast" role="status"></div><dialog id="habit-dialog"><form id="habit-form"><div class="dialog-head"><span class="eyebrow">UN NUEVO COMIENZO</span><button type="button" class="icon-button" id="close-dialog" aria-label="Cerrar">×</button></div><h2>Cultiva un nuevo hábito.</h2><p>Hazlo pequeño. Hazlo tuyo.</p><label>Nombre del hábito<input name="name" placeholder="Por ejemplo, salir a caminar" required maxlength="50"></label><div class="form-row"><label>¿Cómo lo registras?<select name="type"><option value="check">Completado</option><option value="count">Cantidad</option><option value="time">Minutos</option></select></label><label>Objetivo diario<input type="number" name="target" min="1" max="10000" value="1" required></label></div><label>Tu color<select name="color"><option value="lavender">Lavanda</option><option value="mint">Menta</option><option value="peach">Durazno</option><option value="blue">Cielo</option><option value="pink">Rosa</option><option value="yellow">Limón</option></select></label><button class="primary" type="submit">Añadir a mi día <span>＋</span></button></form></dialog><script src="app.js"></script></body></html>
